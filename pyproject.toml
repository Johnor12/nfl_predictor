[project]
name = "nfl-predictor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pyright>=1.1.414",
    "pytest>=8",
]

[[tool.uv.index]]
# Listed first so that a private index in a machine's uv.toml never ends up in uv.lock.
name = "pypi"
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
python_files = ["test_*.py"]
